[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lancy"
# Authors and contributors: see ../CONTRIBUTORS.md
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "docling==2.112.0",
    "fastapi==0.139.0",
    "numpy==2.5.1",
    "ollama==0.6.2",
    "openai==2.45.0",
    "sentence-transformers==5.6.0",
    "partial-json-parser==0.2.1.1.post7",
    "ldap3>=2.9.1",
]
dynamic = ["version"]

[tool.mypy]
python_version = "3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lancy.__version__" }
