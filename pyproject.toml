# Governs the whole repository, `conversational-toolkit/` included — it is a fork
# this project owns rather than a tracked upstream, so it carries no config of its own.
[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = [
    "W605", # pycodestyle: invalid-escape-sequence
    "PGH",  # pygrep-hooks
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PGH003",   # allow blanket type: ignore comments
    "E402",     # module-level import not at top — intentional: .env loaded before third-party imports
    "PLC0415",  # import not at top-level — intentional lazy imports in async methods
    "E401",     # multiple imports on one line — common in the toolkit's module headers
    "RUF001",   # ambiguous unicode in strings — ×, – and ² are deliberate in log output
    "RUF002",   # ambiguous unicode in docstrings — en dash for ranges, e.g. 1–100
    "RUF003",   # ambiguous unicode in comments — same
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
