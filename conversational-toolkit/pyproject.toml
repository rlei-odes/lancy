[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational_toolkit"
authors = []
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.75.0,<0.140.0",
    "httpx>=0.11.0,<0.29.0",
    "python-jose>=1.3.0,<4.0.0",
    "loguru>=0.1.0,<1.0.0",
    "numpy>=1.0.0,<3.0.0",
    "docling>=2.0.0",
    "markitdown>=0.0.1",
    "openpyxl>=3.1.0",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.0.1",
    "ragas>=0.2.0",
    "qwen-vl-utils==0.0.14",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "conversational_toolkit.__version__" }

# Ruff is configured once at the repository root, which governs this directory too.

[tool.mypy]
ignore_missing_imports = true
exclude = "^(venv|examples)/"
