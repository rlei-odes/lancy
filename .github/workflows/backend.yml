name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "conversational-toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "conversational-toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

# A newer commit on the same ref makes an in-flight run redundant.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ruff needs none of the ML stack, so it reports in seconds rather than waiting
  # on the dependency install.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned to the version in requirements.txt: a newer ruff can add rules, and
      # lint results should change when the repo decides to, not on release day.
      - run: pip install ruff==0.12.3

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The version-consistency tests read git tags. A shallow clone has none,
          # and they would skip rather than run.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore venv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          # The workflow file is part of the key: changing how the venv is built has
          # to invalidate it, or a cached environment outlives the fix.
          key: venv-${{ runner.os }}-py313-${{ hashFiles('requirements.txt', 'backend/pyproject.toml', 'conversational-toolkit/pyproject.toml', '.github/workflows/backend.yml') }}

      - name: Create venv
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # The CPU build of torch, installed before requirements.txt so pip finds the
          # dependency satisfied and never resolves the CUDA build with its ~3.4 GB of
          # nvidia/* and triton wheels, which no runner can use. The deployment host
          # installs normally and still gets the GPU build.
          #
          # torchvision has to be named here too, and both have to be pinned.
          # requirements.txt pulls torchvision in transitively (docling-ibm-models), so
          # leaving it out means pip takes it from PyPI, built against a different
          # torch — the extension then fails to register and every import of
          # transformers dies with "operator torchvision::nms does not exist". The
          # versions are the pair the deployment runs, just CPU-flavoured.
          .venv/bin/pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt

      # The editable installs in requirements.txt resolve against the workspace, so
      # a restored venv picks up source changes without reinstalling.
      - name: Tests
        run: .venv/bin/python -m pytest
