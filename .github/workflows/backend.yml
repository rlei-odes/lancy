name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "conversational-toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "conversational-toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

# A newer commit on the same ref makes an in-flight run redundant.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ruff needs none of the ML stack, so it reports in seconds rather than waiting
  # on the dependency install.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned to the version in requirements.txt: a newer ruff can add rules, and
      # lint results should change when the repo decides to, not on release day.
      - run: pip install ruff==0.12.3

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The version-consistency tests read git tags. A shallow clone has none,
          # and they would skip rather than run.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore venv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py313-${{ hashFiles('requirements.txt', 'backend/pyproject.toml', 'conversational-toolkit/pyproject.toml') }}

      - name: Create venv
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # CPU torch first. requirements.txt leaves torch unpinned (it arrives via
          # sentence-transformers), so installing it here satisfies that dependency
          # and keeps pip from resolving the CUDA build with its ~3.4 GB of
          # nvidia/* and triton wheels, which no runner can use. The deployment
          # host installs normally and still gets the GPU build.
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt

      # The editable installs in requirements.txt resolve against the workspace, so
      # a restored venv picks up source changes without reinstalling.
      - name: Tests
        run: .venv/bin/python -m pytest
